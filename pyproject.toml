[project]
name = "python-cookbook-tools"
version = "0.1.0"
description = "python-cookbook 教案构建工具链（PDF 生成等）"
requires-python = ">=3.10"
dependencies = [
    "markdown-it-py>=3.0",
    "pygments>=2.17",
    "playwright>=1.49",
    "linkify-it-py>=2",
    "pymupdf>=1.28.2",
    "mdit-py-plugins>=0.4",
]

[project.scripts]
# 本地一方库入口：uv tool install --editable <仓库根> 后，build 命令全局可用。
# 必须 editable 安装：tools/ 下的主题、模板、KaTeX 资源按 __file__ 相对定位。
build = "build_pdf:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "tools"}
py-modules = ["build_pdf"]
